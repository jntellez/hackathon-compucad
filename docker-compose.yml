services:
  postgres:
    image: postgres:16
    container_name: compucad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: compucad_hackathon
      POSTGRES_USER: compucad
      POSTGRES_PASSWORD: compucad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
